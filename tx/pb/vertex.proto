syntax = "proto3";

package pb;

import "google/protobuf/timestamp.proto";
import "txvX.proto";

option go_package = "/pb";

message Vertex {
    message VertexId {
        bytes id = 1;
        string address = 2;
        uint64 idMajor = 3;
        uint32 idMinor = 4;
    }
    VertexId vertexId = 1;
    double cumWeight = 2;
    double txWeight = 3;
    google.protobuf.Timestamp timestamp = 4;
    Txv1 tx = 5;
}