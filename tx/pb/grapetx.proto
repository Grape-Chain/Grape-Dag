syntax = "proto3";

package pb;

import "ids.proto";
import "txvX.proto";

option go_package = "/pb";

message GrapeTxRecord {

    message AddressInfo {
        bytes multiaddr = 1;
    }

    bytes peer_id = 1;

    uint64 seq = 2;

    bytes tx = 3;

    repeated AddressInfo addresses = 4;

    VersionType version = 5;

    Ids ids = 6;

    reserved 7 to 9;

    oneof transaction {
        Txv1 txv1 = 10;
        Txv2 txv2 = 11;
    }

    uint64 txidmajor = 12;

    uint32 txidminor = 13;

    bytes txidid = 14;

    // Processor attribution for the site this record's transaction was
    // encapsulated into, mirroring Node fields 9-11. It has to travel on the
    // record as well as on the site: a subscribing peer does not rebuild the
    // sender's site from a pb.Node, it builds its own from the transaction (see
    // diffusion/subscribe.go), so the record is the only place the attribution
    // could reach it.
    //
    // 15-17 are the next free numbers: 1-6 and 12-14 are in use, 7-9 are
    // reserved, and 10-11 belong to the `transaction` oneof.
    bytes processor_address = 15;
    bytes processor_pk = 16;
    bytes processor_sig = 17;
}
